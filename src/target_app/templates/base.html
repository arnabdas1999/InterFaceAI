<html>
<head>
<meta name="generator" content="SynthCore 4.2">
<title>SynthCore Teller Workstation</title>
<style>
body { font-family: Verdana, Arial, sans-serif; font-size: 12px; background: #d4d0c8; margin: 0; }
.hdr { background: #003366; color: #fff; }
.hdr a { color: #fff; }
.grid td { border: 1px solid #808080; padding: 3px 6px; background: #fff; }
.lbl { background: #e8e8e8 !important; font-weight: bold; }
.banner-err { background: #ffdddd; border: 1px solid #cc0000; color: #990000; padding: 6px; }
.banner-info { background: #ffffdd; border: 1px solid #999900; padding: 6px; }
.overlay { position: fixed; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,.45); }
.dlg { position: absolute; left: 30%; top: 25%; width: 40%; background: #ece9d8; border: 2px solid #0a246a; }
.dlg .ttl { background: #0a246a; color: #fff; padding: 3px; font-weight: bold; }
</style>
</head>
<body>
<table width="100%" cellspacing="0" cellpadding="4" class="hdr"><tr>
<td><b>SynthCore</b> &middot; {{ b.institution }}</td>
<td align="right">{% if user %}Operator: {{ user }} | <a href="/main">Main Menu</a> | <a href="/logout">Sign Off</a>{% endif %}</td>
</tr></table>
{% block quick %}{% endblock %}
<table width="100%" cellspacing="0" cellpadding="8"><tr><td>
{% block body %}{% endblock %}
</td></tr></table>
<table width="100%"><tr><td align="right"><font size="1" color="#666">SynthCore 4.2.7 build 311 &middot; synthetic data only</font></td></tr></table>
{% block overlays %}{% endblock %}
</body>
</html>
